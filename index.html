<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Combine!</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- timer -->

        <section class="timer-area">

            <div class="timer">
                <span>RODADA <strong id="rodada">1</strong></span>
                <h2 id="tempo">45</h2>
            </div>

            <div class="timer-controles">
                <button onclick="iniciarTempo()" title="Continuar">
                    ▶
                </button>

                <button onclick="pausarTempo()" title="Pausar">
                    ⏸
                </button>

                <button onclick="voltarTempo()" title="Voltar 5 segundos">
                    ↶
                </button>
            </div>

        </section>


        <!-- jogador -->

        <section class="jogadores-area">

            <h2>Jogadores</h2>

            <div id="listaJogadores" class="lista-jogadores">
            </div>

        </section>


        <!-- controle de pontos -->

        <section class="pontos-area">

            <h2>Pontos</h2>

            <div id="controlesJogadores" class="controles-jogadores">
                <!-- controles criados pelo JavaScript -->
            </div>

            <div class="controle-quantidade">

                <button onclick="adicionarJogador()">
                    ＋
                </button>

                <span id="quantidadeJogadores">4 jogadores</span>

                <button onclick="removerJogador()">
                    −
                </button>

            </div>

        </section>


        <!-- rodada -->

        <button class="proxima" onclick="proximaRodada()">
            Próxima rodada
        </button>

        <button class="resetar" onclick="resetarJogo()">
            Resetar jogo
        </button>

    </main>

    <audio id="alarme" src="alarme.mp3"></audio>

    <script src="script.js"></script>

</body>
</html>
